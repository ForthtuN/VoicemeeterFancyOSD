name: FancyOSD validation

on:
  push:
    branches:
      - 'master'
      - 'fix/**'
      - 'test/**'
  pull_request:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply test variant
        if: startsWith(github.ref_name, 'test/')
        shell: pwsh
        run: |
          $path = 'VoicemeeterOsdProgram/Interop/BandWindow.cs'
          $code = (Get-Content $path -Raw).Replace("`r`n", "`n")
          $branch = '${{ github.ref_name }}'

          if ($branch -eq 'test/child-hwnd') {
            $oldStyle = '            WindowStyle = unchecked((int)(WindowStyles.WS_VISIBLE | WindowStyles.WS_POPUP)),'
            $newStyle = '            WindowStyle = (int)(WindowStyles.WS_VISIBLE | WindowStyles.WS_CHILD),'
            if (-not $code.Contains($oldStyle)) { throw 'Expected popup style not found' }
            $code = $code.Replace($oldStyle, $newStyle)

            $lines = $code -split "`n"
            $result = New-Object System.Collections.Generic.List[string]
            $skip = 0
            foreach ($line in $lines) {
              if ($skip -gt 0) { $skip--; continue }
              if ($line.Contains('// !!! may need to update hwndSource')) { $skip = 3; continue }
              $result.Add($line)
            }
            $code = $result -join "`n"

            $oldPos = 'SetWindowPos(hwndSource.Handle, IntPtr.Zero, (int)Left, (int)Top, 0, 0, SWP.NOSIZE | SWP.NOZORDER | SWP.NOACTIVATE);'
            $newPos = 'SetWindowPos(hwndSource.Handle, IntPtr.Zero, 0, 0, 0, 0, SWP.NOSIZE | SWP.NOZORDER | SWP.NOACTIVATE);'
            if (-not $code.Contains($oldPos)) { throw 'Expected popup positioning line not found' }
            $code = $code.Replace($oldPos, $newPos)
          }
          elseif ($branch -eq 'test/popup-zorder') {
            $needle = "        RepositionHwndSource();`n        OnShown();"
            $replacement = "        RepositionHwndSource();`n        SetWindowPos(hwndSource.Handle, new IntPtr(-1),`n            0, 0, 0, 0,`n            SWP.NOACTIVATE | SWP.NOMOVE | SWP.NOSIZE | SWP.NOOWNERZORDER | SWP.SHOWWINDOW);`n        ShowWindow(hwndSource.Handle, (int)ShowWindowCommands.ShowNoActivate);`n        OnShown();"
            if (-not $code.Contains($needle)) { throw 'Expected Show() block not found' }
            $code = $code.Replace($needle, $replacement)
          }

          Set-Content $path $code -Encoding UTF8

      - name: Run regression tests
        shell: pwsh
        run: dotnet test RegressionTests/VoicemeeterFancyOsd.RegressionTests.csproj -c Release --nologo

      - name: Build x64 Release
        shell: pwsh
        run: msbuild VoicemeeterFancyOsd.sln /restore /t:Rebuild /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FancyOSD-${{ github.run_number }}
          path: x64/Release/**
          if-no-files-found: error
          compression-level: 9
